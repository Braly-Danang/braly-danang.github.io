        // Render Logic
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');
            const data = newsData[articleId];

            if (data) {
                document.getElementById('article-date').textContent = data.date;
                document.getElementById('article-title').textContent = data.title;
                document.getElementById('article-content').innerHTML = data.content;
                
                // Render Gallery
                const galleryContainer = document.getElementById('article-gallery');
                
                // --- SPECIAL HANDLING FOR GALA DINNER ---
                if (articleId === 'gala-dinner') {
                    // Custom layout: 1 Vertical Left + 4 Grid Right
                    const verticalImg = data.images.find(img => img.includes('IMG_2988.jpg'));
                    const gridImages = data.images.filter(img => !img.includes('IMG_2988.jpg'));

                    let html = `
                        <div class="col-md-4 mb-3">
                            <img src="${verticalImg}" class="img-fluid rounded w-100" style="object-fit: cover; height: 100%; min-height: 400px;" loading="lazy">
                        </div>
                        <div class="col-md-8">
                            <div class="row">
                    `;
                    
                    gridImages.forEach(img => {
                        html += `
                            <div class="col-md-6 mb-3">
                                <img src="${img}" class="img-fluid rounded w-100" style="object-fit: cover; height: 200px;" loading="lazy">
                            </div>
                        `;
                    });

                    html += `</div></div>`;
                    galleryContainer.innerHTML = html;
                } 
                // --- SPECIAL HANDLING FOR SINGLE/DUAL IMAGES (Avoid Cropping) ---
                else if (['national-day', 'birthday-aug', 'birthday-jun-jul', 'birthday-sep'].includes(articleId)) {
                    data.images.forEach(imgSrc => {
                        const col = document.createElement('div');
                        // Use full width for single, half for dual, but auto height to show full content
                        // Birthday Sep has 2 images, others have 1
                        if (data.images.length === 2) {
                             col.className = 'col-md-6 mb-3';
                        } else {
                             col.className = 'col-md-10 mx-auto mb-3';
                        }
                        
                        col.innerHTML = `<img src="${imgSrc}" class="img-fluid rounded w-100" style="height: auto; min-height: 300px;" loading="lazy">`;
                        galleryContainer.appendChild(col);
                    });
                }
                // --- STANDARD GRID FOR OTHERS ---
                else {
                    // Determine column size based on image count
                    let colClass = 'col-md-6';
                    if (data.images.length === 1) colClass = 'col-md-10 mx-auto'; // Fallback for other single images
                    else if (data.images.length >= 3) colClass = 'col-md-4';
                    
                    if (articleId === 'womens-day' || articleId === 'okr-workshop') colClass = 'col-md-3';

                    data.images.forEach(imgSrc => {
                        const col = document.createElement('div');
                        col.className = `${colClass} mb-3`;
                        col.innerHTML = `<img src="${imgSrc}" class="img-fluid rounded w-100" style="object-fit:cover; height: 250px;" loading="lazy">`;
                        galleryContainer.appendChild(col);
                    });
                }

                document.getElementById('article-container').style.display = 'block';
                document.title = data.title + " - Braly Danang";
            } else {
                document.getElementById('error-message').style.display = 'block';
            }
        });
    </script>
</body>
</html>
